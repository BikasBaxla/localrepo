<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple CSS Flower</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0fdf4;
        }

        .flower-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .blossom {
            position: relative;
            width: 150px;
            height: 150px;
            animation: spin 20s linear infinite;
        }

        .petal {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #ff6b81;
            border-radius: 50% 50% 0 50%;
            top: 45px;
            left: 45px;
        }

        .petal:nth-child(1) { transform: rotate(0deg) translate(40px); }
        .petal:nth-child(2) { transform: rotate(72deg) translate(40px); }
        .petal:nth-child(3) { transform: rotate(144deg) translate(40px); }
        .petal:nth-child(4) { transform: rotate(216deg) translate(40px); }
        .petal:nth-child(5) { transform: rotate(288deg) translate(40px); }

        .center {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #feca57;
            border-radius: 50%;
            top: 50px;
            left: 50px;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stem {
            width: 8px;
            height: 150px;
            background-color: #1dd1a1;
            border-radius: 4px;
            margin-top: -10px;
            position: relative;
            z-index: -1;
        }

        .leaf {
            position: absolute;
            width: 40px;
            height: 20px;
            background-color: #1dd1a1;
            border-radius: 0 20px 0 20px;
            top: 50px;
            left: 6px;
            transform: rotate(-15deg);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="flower-container">
        <div class="blossom">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>
        
        <div class="stem">
            <div class="leaf"></div>
        </div>
    </div>

</body>
</html>
